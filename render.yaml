# Render Blueprint — defines the backend service + database in one file.
# To deploy: in Render, click "New" -> "Blueprint" -> point at the repo (or upload).
# Render reads this file and creates everything in one click.

services:
  - type: web
    name: hailgrade-api
    runtime: node
    plan: starter         # $7/mo. Use "free" while developing, but free tier sleeps after 15min idle.
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true       # Render generates a strong random value
      - key: ANTHROPIC_API_KEY
        sync: false              # You enter this manually in the dashboard
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_SOLO
        sync: false
      - key: STRIPE_PRICE_FIRM
        sync: false
      - key: FRONTEND_URL
        value: https://hailgrade.com
      - key: DATABASE_URL
        fromDatabase:
          name: hailgrade-db
          property: connectionString

databases:
  - name: hailgrade-db
    plan: free        # 1GB free; upgrade to $7/mo "starter" before going to production
    region: oregon
    databaseName: hailgrade
    user: hailgrade
